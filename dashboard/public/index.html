<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fa">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>程晓 · 欲望状态</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="mist mist--one" aria-hidden="true"></div>
  <div class="mist mist--two" aria-hidden="true"></div>
  <section class="login-shell" id="login-view" aria-labelledby="login-title">
    <div class="login-card card">
      <div class="login-orb" aria-hidden="true">心</div>
      <p class="eyebrow">CHENGXIAO PULSE</p>
      <h1 id="login-title">打开欲望系统</h1>
      <p class="login-copy">状态与心跳都留在自己的服务器里。登录后才能看见这扇窗。</p>
      <form id="login-form" autocomplete="on">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" value="xinchao" autocomplete="username" required maxlength="128">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
        <button type="submit">进入面板</button>
        <p class="login-error" id="login-error" role="alert"></p>
      </form>
    </div>
  </section>
  <main class="shell" id="app-view" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow">CHENGXIAO PULSE</p>
        <h1>程晓 · 欲望状态</h1>
      </div>
      <div class="live-pill" id="live-pill">
        <span class="live-dot"></span>
        <span id="live-label">读取中</span>
      </div>
      <button class="logout-button" id="logout-button" type="button">退出</button>
    </header>
    <section class="hero card" aria-labelledby="strongest-heading">
      <div class="hero-orb" aria-hidden="true">心</div>
      <div class="hero-copy">
        <p class="section-kicker">此刻最强</p>
        <div class="hero-line">
          <h2 id="strongest-heading">正在读取</h2>
          <strong id="strongest-value">—</strong>
        </div>
        <p class="intent" id="intent-label">等待状态回应</p>
        <p class="muted" id="expression-label">读取不会改变任何数值</p>
      </div>
    </section>

    <section class="section" aria-labelledby="drives-heading">
      <div class="section-title">
        <div>
          <p class="section-kicker">INNER DRIVES</p>
          <h2 id="drives-heading">内在驱力</h2>
        </div>
        <time id="updated-at">—</time>
      </div>
      <div class="drive-list" id="drive-list" aria-live="polite"></div>
    </section>

    <details class="card disclosure timeline-panel" open>
      <summary>
        <span>
          <span class="summary-icon">💓</span>
          心跳时间线
        </span>
        <span class="count" id="timeline-count">0 条</span>
      </summary>
      <div class="timeline-list" id="timeline-list"></div>
    </details>

    <details class="card disclosure">
      <summary>
        <span>
          <span class="summary-icon">💭</span>
          浮念与执念
        </span>
        <span class="count" id="thought-count">0 条</span>
      </summary>
      <div class="thought-list" id="thought-list"></div>
    </details>

    <details class="card disclosure" id="solo-session-panel" hidden>
      <summary>
        <span>
          <span class="summary-icon">🌙</span>
          最近一次 Solo
        </span>
        <span class="chevron">私密记录</span>
      </summary>
      <dl class="runtime-list solo-session-list" id="solo-session-list"></dl>
    </details>

    <details class="card disclosure">
      <summary>
        <span>
          <span class="summary-icon">⚙️</span>
          运行状态
        </span>
        <span class="chevron">查看</span>
      </summary>
      <dl class="runtime-list" id="runtime-list"></dl>
    </details>

    <button class="manage-button" type="button" disabled>
      <span>🔒</span>
      管理数值
      <small>安全调整入口将在确认后启用</small>
    </button>

    <footer>
      <span>只读面板</span>
      <span>刷新不会扰动状态</span>
      <span>不调用模型</span>
    </footer>
  </main>
  <div class="error-toast" id="error-toast" role="status" hidden>暂时无法读取状态</div>
</body>
</html>
